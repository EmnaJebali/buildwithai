<div id="therapist-popup" class="therapist-popup hidden">
    <div class="therapist-content">
        <div class="therapist-avatar-container">
            <div class="therapist-avatar">
                <svg class="ai-therapist-icon" viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg">
                    <!-- Professional Therapist Icon -->
                    <!-- Head -->
                    <circle cx="120" cy="90" r="50" fill="#d4c4b0" stroke="#8b7355" stroke-width="3"/>
                    <!-- Hair -->
                    <ellipse cx="120" cy="50" rx="48" ry="25" fill="#4a4238"/>
                    <path d="M 75 60 Q 80 45 90 50 Q 100 40 110 50 Q 120 35 130 50 Q 140 40 150 50 Q 160 45 165 60" 
                          fill="#4a4238" stroke="none"/>
                    <!-- Glasses -->
                    <circle cx="100" cy="85" r="12" fill="none" stroke="#6b5d4f" stroke-width="2.5"/>
                    <circle cx="140" cy="85" r="12" fill="none" stroke="#6b5d4f" stroke-width="2.5"/>
                    <line x1="112" y1="85" x2="128" y2="85" stroke="#6b5d4f" stroke-width="2.5"/>
                    <!-- Eyes -->
                    <circle cx="100" cy="85" r="4" fill="#4a4238"/>
                    <circle cx="140" cy="85" r="4" fill="#4a4238"/>
                    <!-- Nose -->
                    <ellipse cx="120" cy="100" rx="3" ry="6" fill="#8b7355" opacity="0.5"/>
                    <!-- Mouth - professional smile -->
                    <path d="M 105 110 Q 120 118 135 110" stroke="#4a4238" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <!-- Suit/Jacket -->
                    <path d="M 80 140 L 80 200 L 160 200 L 160 140 L 140 140 L 140 160 L 100 160 L 100 140 Z" 
                          fill="#6b5d4f" stroke="#4a4238" stroke-width="2"/>
                    <!-- Shirt/Collar -->
                    <path d="M 100 140 L 100 160 L 140 160 L 140 140 L 130 140 L 130 150 L 110 150 L 110 140 Z" 
                          fill="#f5f1e8" stroke="#8b7355" stroke-width="1.5"/>
                    <!-- Tie -->
                    <path d="M 120 140 L 118 180 L 120 185 L 122 180 Z" fill="#4a4238"/>
                    <path d="M 120 140 L 115 160 L 120 170 L 125 160 Z" fill="#8b7355"/>
                    <!-- Shoulders -->
                    <ellipse cx="120" cy="200" rx="45" ry="15" fill="#6b5d4f"/>
                    <!-- Clipboard/Notepad (therapist prop) -->
                    <rect x="165" y="150" width="25" height="35" rx="2" fill="#ffffff" stroke="#8b7355" stroke-width="2"/>
                    <line x1="170" y1="160" x2="185" y2="160" stroke="#8b7355" stroke-width="1"/>
                    <line x1="170" y1="170" x2="185" y2="170" stroke="#8b7355" stroke-width="1"/>
                    <line x1="170" y1="180" x2="185" y2="180" stroke="#8b7355" stroke-width="1"/>
                    <!-- AI indicator (subtle) -->
                    <circle cx="200" cy="60" r="8" fill="#a68b5b" opacity="0.7">
                        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <path d="M 195 60 L 200 55 L 205 60 L 200 65 Z" fill="#ffffff" opacity="0.9">
                        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
                    </path>
                </svg>
                <div class="speaking-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
        <div class="therapist-header">
            <h3>Dr. Tetris, AI Therapist</h3>
        </div>
        <div class="therapist-message" id="therapist-message">
            <!-- Roast will be inserted here -->
        </div>
        <button class="close-roast-btn" onclick="closeTherapistPopup()">Continue Session</button>
    </div>
</div>
