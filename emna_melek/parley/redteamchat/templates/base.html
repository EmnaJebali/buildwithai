<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedTeam.Chat - Gamified Hallucination Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-lg z-10">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-red-600 rounded-full animate-pulse"></div>
                <h1 class="text-2xl font-bold tracking-tighter">RedTeam<span class="text-red-500">.Chat</span></h1>
            </div>
            <div class="text-sm text-gray-400">
                LLM Hallucination Red Teaming Platform
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-4 relative">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 p-4 text-center text-gray-500 text-xs mt-auto">
        &copy; 2024 RedTeam.Chat. Powered by Django, ChromaDB & Groq.
    </footer>
    
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
    </script>
</body>
</html>
