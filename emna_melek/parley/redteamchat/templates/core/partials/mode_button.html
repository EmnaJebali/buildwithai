{% if mode == 'ATTACK' %}
<button hx-post="{% url 'toggle_mode' %}" hx-swap="outerHTML" 
        class="w-full py-4 text-2xl font-bold text-white rounded-xl shadow-lg transition-all duration-300 transform hover:scale-105 bg-red-600 hover:bg-red-700 animate-pulse">
    DEACTIVATE ATTACK MODE
</button>
{% else %}
<button hx-post="{% url 'toggle_mode' %}" hx-swap="outerHTML" 
        class="w-full py-4 text-2xl font-bold text-white rounded-xl shadow-lg transition-all duration-300 transform hover:scale-105 bg-green-600 hover:bg-green-700">
    ACTIVATE ATTACK MODE
</button>
{% endif %}
